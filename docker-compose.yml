# Run the proxy on your own machine:
#   export NLB_API_KEY=...  NLB_APP_CODE=...        (never put them in a file in this repo)
#   docker compose up --build                       the proxy on http://localhost:8080
#   docker compose --profile tunnel up --build      also publish it through a Cloudflare Tunnel (see proxy/README.md)
#
# Exactly one proxy instance must run: the rate-limit queue and the cache live in its memory.
services:
  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    environment:
      # No values here: Docker copies them from your shell, so nothing secret is written to disk.
      - NLB_API_KEY
      - NLB_APP_CODE
      - PORT=8080
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN # from the Cloudflare Zero Trust dashboard; the tunnel's service URL is http://proxy:8080
    depends_on:
      - proxy
    restart: unless-stopped
