<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hiro-Kids filters</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E3F8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Nunito Sans', system-ui, sans-serif; color: #14213D">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px">Filters</h1>
    <a href="Results.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14213D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 12px 20px">

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 800">Type of book</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #2B59C3; background: #E6EDFB; color: #1E3F8F; font: inherit; font-size: 14px; font-weight: 800">Picture books</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">Junior fiction</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">Junior non-fiction</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 800">Language</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">English</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">Chinese 中文</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">Malay</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">Tamil தமிழ்</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #EEF1F5">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 800">On the shelf now</span>
          <span style="font-size: 13px; color: #4A5568">Only books on the shelf at this library</span>
        </span>
        <button type="button" aria-label="On the shelf now" aria-pressed="true" style="width: 56px; height: 34px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 4px; background: #2B59C3; display: flex; justify-content: flex-end">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span>
        </button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #EEF1F5; border-bottom: 1px solid #EEF1F5">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 800">Include teen books</span>
          <span style="font-size: 13px; color: #4A5568">Children mode only. Off by default.</span>
        </span>
        <button type="button" aria-label="Include teen books" aria-pressed="false" style="width: 56px; height: 34px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 4px; background: #8C96A8; display: flex; justify-content: flex-start">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span>
        </button>
      </div>
    </section>
  </main>

  <div style="display: flex; gap: 12px; padding: 12px 20px 28px; border-top: 1px solid #E3E7EE">
    <button type="button" style="height: 52px; padding: 0 20px; border-radius: 16px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 16px; font-weight: 800">Clear all</button>
    <a href="Results.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #2B59C3; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800">Show books</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  }

</body>
</html>
