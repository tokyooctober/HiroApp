<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hiro-Kids search home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E3F8F}
input::placeholder{color:#5B6475}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Nunito Sans', system-ui, sans-serif; color: #14213D">
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 16px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: {{sun}}; display: flex; align-items: center; justify-content: center; color: #14213D">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path><path d="M9 7h6"></path></svg>
        </div>
        <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px">Hiro-Kids</span>
      </div>
    </div>

    <a href="Location.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #EEF3FB; color: #14213D; text-decoration: none">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FFFFFF; color: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 13px; color: #3D4555; font-weight: 700">You’re at</span>
        <span style="font-size: 16px; font-weight: 800">Tampines Regional Library</span>
      </span>
      <span style="font-size: 14px; font-weight: 800; color: {{accent}}">Change</span>
    </a>

    <sc-if value="{{isKids}}" hint-placeholder-val="{{ true }}">
      <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15">Find a book</h1>
    </sc-if>
    <sc-if value="{{isAdult}}" hint-placeholder-val="{{ false }}">
      <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15">Find an adult book</h1>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="mode-label" style="font-size: 13px; font-weight: 800; color: #3D4555">Searching for</span>
      <div role="group" aria-labelledby="mode-label" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 18px; background: #EEF1F6">
        <button type="button" aria-pressed="{{kidsPressed}}" onClick="{{showKids}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: {{kidsBorder}}; background: {{kidsBg}}; color: {{kidsFg}}; font: inherit; font-size: 16px; font-weight: 800">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M6 21v-2a6 6 0 0 1 12 0v2"></path><path d="M9.5 7.5h.01M14.5 7.5h.01"></path></svg>
          Children’s books
        </button>
        <button type="button" aria-pressed="{{adultPressed}}" onClick="{{showAdult}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: {{adultBorder}}; background: {{adultBg}}; color: {{adultFg}}; font: inherit; font-size: 16px; font-weight: 800">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path></svg>
          Adult books
        </button>
      </div>
    </div>

    <form style="display: flex; gap: 8px; margin: 0">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{searchLabel}}</label>
      <div style="flex-grow: 1; min-width: 0; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border: 2px solid {{modeColor}}; border-radius: 16px; background: #FFFFFF">
        <span style="flex-shrink: 0; padding: 4px 8px; border-radius: 8px; background: {{modeTint}}; color: {{modeInk}}; font-size: 12px; font-weight: 800">{{modeTag}}</span>
        <input id="q" type="search" placeholder="Title, author, topic, ISBN" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; padding: 0; font: inherit; font-size: 16px; color: #14213D; background: transparent">
      </div>
      <a href="Results.dc.html" aria-label="{{searchLabel}}" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 16px; background: {{modeColor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </a>
    </form>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{quick}}" as="c" hint-placeholder-count="2">
        <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3E3; background: #FFFFFF; color: #14213D; font: inherit; font-size: 14px; font-weight: 700">{{c}}</button>
      </sc-for>
      <a href="Filters.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #14213D; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
        Filters
      </a>
    </div>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px">Recently viewed</h2>
        <span style="font-size: 13px; color: #4A5568">Saved on this phone</span>
      </div>
      <div style="display: flex; gap: 14px">
        <sc-for list="{{recent}}" as="item" hint-placeholder-count="3">
          <a href="Detail.dc.html" style="width: 104px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #14213D">
            <div style="width: 104px; height: 112px; border-radius: 12px; background: {{item.coverBg}}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; line-height: 1.15">{{item.title}}</div>
            <span style="font-size: 13px; font-weight: 700; line-height: 1.25">{{item.title}}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="display: flex; justify-content: space-around; border-top: 1px solid #E3E7EE; padding: 8px 0 22px; background: #FFFFFF">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 48px; justify-content: center; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
    <a href="Favourites.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 48px; justify-content: center; text-decoration: none; color: #4A5568; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Favourites</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 48px; justify-content: center; text-decoration: none; color: #4A5568; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#0F766E","#7C3AED"]},"sun":{"editor":"color","default":"#FFC94A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { audience: 'kids' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const kids = this.state.audience === 'kids';
    const kidsColor = '#B4530A', adultColor = '#2B59C3';
    const modeColor = kids ? kidsColor : adultColor;
    return {
      accent: accent,
      sun: this.props.sun ?? '#FFC94A',
      isKids: kids,
      isAdult: !kids,
      kidsPressed: kids ? 'true' : 'false',
      adultPressed: kids ? 'false' : 'true',
      kidsBg: kids ? kidsColor : 'transparent',
      kidsFg: kids ? '#FFFFFF' : '#3D4555',
      kidsBorder: '0',
      adultBg: kids ? 'transparent' : adultColor,
      adultFg: kids ? '#3D4555' : '#FFFFFF',
      adultBorder: '0',
      modeColor: modeColor,
      modeTint: kids ? '#FFEAD2' : '#E6EDFB',
      modeInk: kids ? '#7A3606' : '#1E3F8F',
      modeTag: kids ? 'Children' : 'Adult',
      searchLabel: kids ? 'Search children’s books in this library' : 'Search adult books in this library',
      showKids: () => this.setState({ audience: 'kids' }),
      showAdult: () => this.setState({ audience: 'adult' }),
      quick: kids ? ['Picture books', 'Junior fiction', 'On the shelf now'] : ['Fiction', 'Non-fiction', 'On the shelf now'],
      recent: kids ? [
        { title: 'Tiny T-Rex Goes to School', coverBg: '#FFE3A3' },
        { title: 'Stegosaurus Sleepover', coverBg: '#CDE7FF' },
        { title: 'Moon Bear’s Big Night', coverBg: '#E5DBFF' }
      ] : [
        { title: 'The Quiet Kitchen', coverBg: '#D7F0D2' },
        { title: 'Walking the Old Rail Line', coverBg: '#CDE7FF' },
        { title: 'A Year of Small Habits', coverBg: '#FAD4D8' }
      ]
    };
  }
}
</script>
</body>
</html>
