<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hiro-Kids which library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E3F8F}
input::placeholder{color:#5B6475}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Nunito Sans', system-ui, sans-serif; color: #14213D">
  <header style="display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14213D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px">Which library are you at?</h1>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 16px; overflow: hidden">
    <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; border: 2px solid #C9D3E3; background: #FFFFFF; text-align: left; font: inherit; color: #14213D">
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #E6EDFB; color: #2B59C3; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 800">Detect the library I’m in</span>
        <span style="font-size: 13px; color: #4A5568">Uses your location once. It stays on this phone.</span>
      </span>
    </button>

    <div style="display: flex; align-items: center; gap: 10px; color: #4A5568; font-size: 13px; font-weight: 700">
      <span style="flex-grow: 1; height: 1px; background: #E3E7EE"></span>or choose it<span style="flex-grow: 1; height: 1px; background: #E3E7EE"></span>
    </div>

    <div>
      <label for="lib" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a library</label>
      <input id="lib" type="search" placeholder="Find a library" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #C9D3E3; border-radius: 14px; font: inherit; font-size: 16px">
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{libs}}" as="l" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{l.pressed}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; border-bottom: 1px solid #EEF1F5; background: transparent; text-align: left; font: inherit; font-size: 15px; font-weight: {{l.weight}}; color: #14213D">
          {{l.name}}
          <sc-if value="{{l.selected}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B59C3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="padding: 12px 20px 28px; border-top: 1px solid #E3E7EE">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #2B59C3; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800">I’m at Tampines Regional</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Tampines Regional Library', 'Pasir Ris Public Library', 'Bedok Public Library', 'Punggol Regional Library', 'Woodlands Regional Library', 'Jurong Regional Library', 'library@orchard'];
    return {
      libs: names.map((n, i) => ({ name: n, selected: i === 0, pressed: i === 0 ? 'true' : 'false', weight: i === 0 ? 800 : 600 }))
    };
  }
}
</script>
</body>
</html>
